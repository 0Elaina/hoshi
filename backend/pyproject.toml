[project]
name = "hoshi"
version = "0.1.0"
description = "Hoshi FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.163.1",
    "fastapi-pagination[sqlalchemy]>=0.16.2,<0.17",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "redis>=8.1,<9",
    "sqlalchemy[asyncio]>=2.1,<3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff>=0.17.5"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]
